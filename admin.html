<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://*.workers.dev https://*.nusukey.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>NusukKey · পিন করা কোড</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#F7F6F3;--ink:#1E2320;--muted:#71756F;--line:#ECE8E0;--green:#00663A;--orange:#E39B1B;--danger:#B42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:26px;margin:0 0 4px}p{color:var(--muted);margin:0 0 16px}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05)}
label{font-weight:600;font-size:14px;display:block;margin-bottom:6px}
input,textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
textarea{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.row{display:flex;gap:8px;margin-top:10px}
button{font:inherit;font-weight:600;min-height:46px;padding:0 16px;border-radius:12px;border:0;cursor:pointer}
.g{background:var(--green);color:#fff;flex:1}.l{background:var(--bg)}
.msg{min-height:22px;font-size:14px;margin-top:8px;color:var(--muted)}.bad{color:var(--danger)}
ul{list-style:none;margin:0;padding:0}li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}li:first-child{border:0}
li code{font:600 15px ui-monospace,Menlo,monospace}li small{color:var(--muted);margin-inline-start:auto}
li button{min-height:36px;background:#FDECEA;color:var(--danger);padding:0 12px}
</style>
<script src="config.js" defer></script>
<script src="admin.js" defer></script>
</head>
<body>
<main>
  <h1>পিন করা কোড</h1>
  <p>পিন করা কোড সবার উপরে দেখায়, আর রিপোর্টে লুকায় না। এই পেজের লিংক কাউকে দেবেন না।</p>
  <div class="card">
    <label for="tok">অ্যাডমিন টোকেন</label>
    <input id="tok" type="password" autocomplete="off" spellcheck="false">
    <div class="row"><button class="l" id="load" type="button">লিস্ট দেখুন</button></div>
  </div>
  <div class="card">
    <label for="txt">কোড বা পুরো নুসুক মেসেজ</label>
    <textarea id="txt" placeholder="NG-vW7So71R"></textarea>
    <div class="row"><button class="g" id="pin" type="button">পিন করুন</button><button class="l" id="unpin" type="button">আনপিন করুন</button></div>
    <div class="msg" id="msg" role="status"></div>
  </div>
  <div class="card"><ul id="list"><li>টোকেন দিয়ে লিস্ট দেখুন।</li></ul></div>
</main>
</body>
</html>
