name = "nusukey-api"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
# Comma-separated list of sites allowed to call the API.
ALLOWED_ORIGINS = "https://devzonayed.github.io,http://localhost:8080,http://127.0.0.1:8080"

[[d1_databases]]
binding = "DB"
database_name = "nusukey"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

# Edge rate limits (per IP / per key). 30 writes per minute.
[[ratelimits]]
name = "RL"
namespace_id = "7301"
simple = { limit = 30, period = 60 }

# Secret (not here): npx wrangler secret put KEY_PEPPER

[triggers]
crons = ["17 * * * *"]
