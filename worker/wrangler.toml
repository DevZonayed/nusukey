name = "nusukey-api"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
# Comma-separated list of sites allowed to call the API.
ALLOWED_ORIGINS = "https://nusukey.pages.dev,https://devzonayed.github.io,http://localhost:8080,http://127.0.0.1:8080"

[[d1_databases]]
binding = "DB"
database_name = "nusukey"
database_id = "3ea60af9-5703-4241-ad9b-0f6734cb55c9"

# Edge rate limits (per IP / per key). 30 writes per minute.
[[ratelimits]]
name = "RL"
namespace_id = "7301"
simple = { limit = 30, period = 60 }

# Secret (not here): npx wrangler secret put KEY_PEPPER

[triggers]
crons = ["17 * * * *"]
